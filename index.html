<style>
  :root{
    --navy:#1C2B4A; --navy-lt:#2B3E63; --slate:#16243B; --slate-dp:#0B1524;
    --yellow:#F5C518; --yellow-dk:#B8960A; --yellow-lt:#FFD84A;
    --cream:#F3EFE4; --steel:#8098B4;
    --display:"Archivo Black","Arial Black",system-ui,sans-serif;
    --body:"Archivo",system-ui,-apple-system,sans-serif;
    --mono:"DM Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:radial-gradient(96% 74% at 50% 46%, #0D1424 0%, #05070D 68%);
    color:var(--cream);font-family:var(--body);
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px;
    /* Mashing a D-pad is a drag gesture as far as the browser is concerned,
       so without this the page selects its own text and a phone throws up the
       copy/paste callout mid-game. */
    user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  }
  #landing,nav{user-select:auto;-webkit-user-select:auto}

  /* ================= the landing =================
     A name, two lines, the links, and the button. Everything else the site
     has to say is inside the game, so the page gets out of the way. */
  .wrap{width:100%;max-width:560px;text-align:left}
  h1{
    margin:0 0 26px;font-family:var(--display);font-weight:400;
    font-size:clamp(30px,7vw,44px);letter-spacing:.01em;line-height:1;color:var(--cream);
  }
  nav{display:flex;gap:10px;flex-wrap:wrap;margin:0}
  nav a{
    font-size:14.5px;font-weight:700;text-decoration:none;
    padding:11px 18px;border-radius:8px;
    color:var(--navy);background:var(--yellow);box-shadow:0 3px 0 var(--yellow-dk);
  }
  nav a:hover{background:var(--yellow-lt)}
  nav a:active{transform:translateY(2px);box-shadow:0 1px 0 var(--yellow-dk)}
  nav a.quiet{
    background:#22344F;color:#DCE8F6;
    border:1px solid #4A6C9C;box-shadow:0 3px 0 #0D1626;
  }
  nav a.quiet:hover{background:#2C4162;color:#fff;border-color:#5C7CAC}
  a:focus-visible,button:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  .play{
    margin-top:14px;
    display:flex;align-items:center;gap:14px;cursor:pointer;
    font-family:var(--display);font-weight:400;font-size:clamp(15px,3.6vw,18px);
    letter-spacing:.02em;text-transform:uppercase;
    color:var(--navy);background:var(--yellow);
    border:0;border-radius:10px;padding:16px 22px;
    box-shadow:0 5px 0 var(--yellow-dk);
  }
  .play:hover{background:var(--yellow-lt)}
  .play:active{transform:translateY(3px);box-shadow:0 2px 0 var(--yellow-dk)}
  .play .tgt{
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;
    text-transform:none;color:#6A5408;border-left:1px solid rgba(80,62,6,.4);padding-left:14px;
  }
  .sub{margin:12px 0 0;font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:#5E7189}
  /* deck: controls flank the screen on wide, sit under it on narrow */
  .deck{display:grid;gap:10px;grid-template-areas:"l screen r";grid-template-columns:auto 1fr auto;align-items:center}
  .ctl-l{grid-area:l} .ctl-r{grid-area:r} .screenwrap{grid-area:screen;min-width:0}

  .bezel{
    position:relative;width:100%;aspect-ratio:384/240;
    background:var(--navy);border-radius:9px;
    padding:9px 9px 7px;
    box-shadow:inset 0 3px 8px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.5);
    display:flex;align-items:center;justify-content:center;
  }
  .screen{position:relative;width:100%;height:100%;overflow:hidden;background:var(--slate);display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:pixelated}
  .layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .led{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:#3FD07A;box-shadow:0 0 5px #3FD07A}
  .keyhint{pointer-events:none}

  .exitbtn{
    position:absolute;bottom:8px;left:8px;z-index:26;
    background:rgba(12,20,34,.82);border:1px solid rgba(140,180,230,.4);
    color:#C8D6E6;border-radius:6px;padding:6px 10px;cursor:pointer;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  }
  .exitbtn:hover{background:rgba(24,40,64,.95);color:#fff;border-color:#8AA6CC}
  .exitbtn:active{transform:translateY(1px)}

  .panel{pointer-events:auto;width:min(430px,90%);background:var(--navy);border:3px solid var(--yellow);box-shadow:7px 7px 0 rgba(0,0,0,.45);padding:15px 16px 14px}
  .panel .lbl{margin:0 0 5px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow)}
  .panel h2{margin:0 0 8px;font-family:var(--display);font-size:16px;letter-spacing:.04em;text-transform:uppercase}
  .panel p{margin:0 0 11px;font-size:13px;line-height:1.55;color:#CDD9E7;max-width:60ch}
  .x{cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:none;border:2px solid #3B5077;color:var(--steel);padding:6px 11px}
  .toast{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);margin:0;background:var(--navy);border:2px solid var(--yellow);font-family:var(--mono);font-size:clamp(8px,1.6vw,11px);color:var(--cream);padding:4px 9px;max-width:94%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---- D-pad ---- */
  .dpad{display:grid;grid-template-columns:repeat(3,var(--dp));grid-template-rows:repeat(3,var(--dp));--dp:46px}
  .dpad .sp{visibility:hidden}
  .dpad .hub{background:var(--navy-lt);display:grid;place-items:center}
  .dpad .hub b{width:8px;height:8px;border-radius:50%;background:#1A2842;display:block}
  .db{
    cursor:pointer;border:0;padding:0;background:var(--navy-lt);color:#93A6C6;
    font-size:15px;line-height:1;display:grid;place-items:center;
    touch-action:none;user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.13), 0 3px 0 #16233B;
  }
  .db.u{border-radius:8px 8px 0 0}
  .db.d{border-radius:0 0 8px 8px}
  .db.l{border-radius:8px 0 0 8px}
  .db.r{border-radius:0 8px 8px 0}
  .db:hover{background:#33477034}
  .db:active,.db.held{background:#22335A;color:var(--yellow);transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(0,0,0,.2),0 1px 0 #16233B}

  /* ---- action buttons ---- */
  .acts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:center;width:126px}
  .ab{
    cursor:pointer;border:0;border-radius:50%;width:56px;height:56px;
    font-family:var(--display);font-size:17px;color:var(--navy);
    background:radial-gradient(circle at 34% 30%, var(--yellow-lt), var(--yellow) 62%);
    box-shadow:0 4px 0 var(--yellow-dk), inset 0 -2px 0 rgba(0,0,0,.12);
    touch-action:none;user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    display:grid;place-items:center;
  }
  .ab.b{background:radial-gradient(circle at 34% 30%, #7E93B8, #4B6086 62%);color:#EAF0F7;box-shadow:0 4px 0 #33445F, inset 0 -2px 0 rgba(0,0,0,.14)}
  .ab:active,.ab.held{transform:translateY(3px);box-shadow:0 1px 0 var(--yellow-dk)}
  .ab.b:active,.ab.b.held{box-shadow:0 1px 0 #33445F}
  .acts .a-wrap{grid-column:2;transform:translateY(-14px)}
  .acts .b-wrap{grid-column:1;transform:translateY(10px)}

  .keyhint{margin:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:#8A8271;text-align:center}
  /* ================= the console =================
     Only shown once you press play. The case, the D-pad and the buttons are
     unchanged from the version that shipped: they solve touch controls, and
     on a console shell nobody needs to be told what a D-pad does. */
  .console{
    width:100%;display:none;flex-direction:column;gap:9px;
    background:linear-gradient(180deg,#2C4269 0%,#203353 44%,#16243C 100%);
    border:3px solid #405C8C;border-radius:18px;
    padding:16px 22px 14px;
    box-shadow:
      inset 0 3px 0 rgba(160,200,245,.30),
      inset 0 -6px 0 rgba(6,12,22,.55),
      0 30px 80px rgba(0,0,0,.62);
  }
  .stagewrap{display:none;flex-direction:column;align-items:stretch;width:100%}
  body.playing .stagewrap{display:flex}
  body.playing .console{display:flex}
  body.playing #landing{display:none}
  body.playing{padding:20px}

  .backrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin:0 0 14px}
  .backrow .who{font-family:var(--display);font-size:16px;letter-spacing:.02em;color:#8CA3C2}
  .back{
    cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;
    background:#18243A;color:#BCD0E8;border:1px solid #33496C;border-radius:7px;padding:8px 13px;
  }
  .back:hover{background:#22314C;color:#fff}

  /* ---- desktop: the wide handheld, sized so the controls always fit ---- */
  @media (min-width:861px){
    .stagewrap{width:auto}
    .console{width:auto;max-width:none}
    .ctl-l,.ctl-r{width:172px;display:flex;justify-content:center}
    .screenwrap{display:flex;align-items:center;justify-content:center}
    /* Capped three ways at once: viewport height, an absolute ceiling, and
       whatever width is left once the controls have taken theirs. Drop that
       third cap and the aspect ratio pushes the D-pad off the case. */
    .bezel{
      height:max(210px, min(54vh, 470px, calc((100vw - 520px) * 0.625)));
      width:auto;aspect-ratio:384/240;
      border-radius:10px;padding:8px 8px 7px;background:#0A1120;
      box-shadow:inset 0 3px 9px rgba(0,0,0,.75), 0 1px 0 rgba(150,190,240,.2);
    }
    .deck{grid-template-areas:"l screen r";grid-template-columns:auto auto auto;
      align-items:center;justify-items:center;gap:26px}
    .screen{background:#0A1120}
    .led{left:12px}
    .dpad{--dp:56px}
    .ab{width:72px;height:72px;font-size:20px}
    .acts{width:160px;gap:12px}
    .db{background:#101E33;color:#8FADD4;box-shadow:inset 0 2px 0 rgba(255,255,255,.08), 0 4px 0 #0A1220}
    .db:active,.db.held{background:#0A1220;color:var(--yellow)}
    .dpad .hub{background:#101E33}
    .dpad .hub b{background:#070D16}
    .keyhint{color:#5D739A;font-size:11px}
  }

  /* ---- phone: screen on top, controls beneath ---- */
  @media (max-width:860px){
    body{padding:20px 14px}
    body.playing{padding:8px}
    .console{border-radius:22px;padding:12px 8px 18px}
    .deck{
      grid-template-areas:"screen screen" "l r";
      grid-template-columns:1fr 1fr;
      justify-items:center;align-items:end;align-content:start;
      gap:18px 8px;
    }
    /* Fixed control widths overflow the deck on a narrow phone, and because
       the screen spans both columns any overflow knocks the canvas off
       centre. Scaling with the viewport keeps everything inside the case and
       still clears the 44px touch minimum at 320px wide. */
    .dpad{--dp:clamp(44px, 14.5vw, 68px)}
    .ab{width:clamp(60px,18.5vw,82px);height:clamp(60px,18.5vw,82px);font-size:clamp(17px,5vw,22px)}
    .acts{width:clamp(132px,41vw,180px);gap:clamp(8px,3vw,14px)}
    /* justify-items:center centres the control cells, but the screen spans
       both columns and must stretch instead or it shrink-wraps. */
    .screenwrap{min-width:0;justify-self:stretch;width:100%}
    .bezel{padding:4px 4px 3px;border-radius:9px;background:#0C1524;
      box-shadow:inset 0 2px 7px rgba(0,0,0,.7), 0 1px 0 rgba(140,180,230,.16)}
    .led{left:9px}
    .db{background:#0F1B2E;color:#8AA6CC;box-shadow:inset 0 2px 0 rgba(255,255,255,.07), 0 3px 0 #0A1220}
    .db:active,.db.held{background:#0A1220;color:var(--yellow)}
    .dpad .hub{background:#0F1B2E}
    .dpad .hub b{background:#070D16}
    .keyhint{display:none}
  }

  /* ---- phone turned sideways: the screen gets the whole width ---- */
  @media (max-width:900px) and (orientation:landscape){
    body.playing{padding:5px 10px}
    .backrow{margin:0 0 4px}
    .backrow .who{display:none}
    .back{font-size:10.5px;padding:5px 10px}
    .console{padding:6px 8px 8px;gap:4px}
    .deck{grid-template-areas:"l screen r";grid-template-columns:auto auto auto;
      align-items:center;justify-items:center;gap:8px}
    /* A sideways phone is short, not narrow, so here the screen is driven by
       the height that is left rather than by the width. */
    .screenwrap{justify-self:center;width:auto}
    .bezel{
      height:max(140px, min(calc(100dvh - 92px), calc((100vw - 300px) * 0.625)));
      width:auto;aspect-ratio:384/240;
    }
    .ctl-l,.ctl-r{width:128px;display:flex;justify-content:center}
    .dpad{--dp:42px}
    .ab{width:50px;height:50px;font-size:15px}
    .acts{width:112px;gap:7px}
  }

  @media (prefers-reduced-motion:reduce){
    nav a:active,.db:active,.ab:active,.db.held,.ab.held,.play:active{transform:none}
  }
</style>
</head>
<body>
<main id="landing">
  <div class="wrap">
    <h1>Stephen Henley</h1>

    <nav aria-label="Links">
      <a href="https://www.facebook.com/whatshappeningknox" target="_blank" rel="noopener">Whats Happening Knox</a>
      <a class="quiet" href="https://linkedin.com/in/stephenhenley1" target="_blank" rel="noopener">LinkedIn</a>
    </nav>

    <button class="play" id="playbtn">
      Beat the high score
      <span class="tgt" id="tgt"></span>
    </button>
    <p class="sub" id="yourbest"></p>
  </div>
</main>

<div class="stagewrap">
  <div class="backrow">
    <span class="who">Stephen Henley</span>
    <button class="back" id="backbtn">&#8592; Back</button>
  </div>
<div class="console" id="console">
  <div class="deck">

    <div class="ctl-l">
      <div class="dpad" role="group" aria-label="Fly">
        <span class="sp"></span>
        <button class="db u" data-k="up" aria-label="Climb">&#9650;</button>
        <span class="sp"></span>
        <button class="db l" data-k="left" aria-label="Left">&#9664;</button>
        <span class="hub"><b></b></span>
        <button class="db r" data-k="right" aria-label="Right">&#9654;</button>
        <span class="sp"></span>
        <button class="db d" data-k="down" aria-label="Down">&#9660;</button>
        <span class="sp"></span>
      </div>
    </div>

    <div class="screenwrap">
      <div class="bezel">
        <span class="led" aria-hidden="true"></span>
        <div class="screen" id="stage">
          <canvas id="cv" aria-label="A dragon flying over a night ridge, breathing fire at archers below"></canvas>
          <button class="exitbtn" id="exitbtn">&#10005; Leave</button>
        </div>
      </div>
    </div>

    <div class="ctl-r">
      <div class="acts" role="group" aria-label="Actions">
        <span class="b-wrap"><button class="ab b" data-k="call" aria-label="Special attack">B</button></span>
        <span class="a-wrap"><button class="ab" data-k="use" aria-label="Breathe fire">A</button></span>
      </div>
    </div>

  </div>

  <p class="keyhint">Up to climb &middot; A breathes fire &middot; B when the bar is full &middot; Esc to leave</p>
</div>
</div>

<script>
(function(){
  "use strict";

  /* The score a visitor is trying to beat. Change this one number when you
     set a new personal best; it is what the landing button advertises. */
  var TARGET = 220;

  var W=384, H=240;
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tick=0;

  function r(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  var keys={};
  var mode='idle';   // 'idle' on the landing, 'game' once you press play
  /* =========================================================
     THE DESK GAME  (unnamed on purpose)
     The black wyrm, the fire-breath and the charged fireball are ported
     from the original build and rescaled to this room's 384x240 screen.
     Night version. Hold UP to climb, hold A to breathe, B when charged.
     ========================================================= */

  var SC = 0.42;                        // original was drawn for a 960x540 stage
  var GY = H - 46;                      // ground line
  var TOPM = 18, BOTM = GY - 14;
  var DX = 96;                          // dragon's fixed x

  var GRAVA=150, LIFTA=-430, VUP=-105, VDN=95;
  var SCROLLV=34;
  var FIRE_ANG=20*Math.PI/180, FIRE_V=272, FIRE_G=49, FIRE_RATE=0.05, FIRE_LIFE=1.05, FLAME_R=4.2;
  var ARROW_V=104, ARROW_G=36, ARROW_R=2.8;
  var ROCK_V=142, ROCK_G=75, ROCK_R=5.4;
  // The ballista bolt: fast, nearly flat, and a third of the health bar.
  var BOLT_V=250, BOLT_G=8, BOLT_R=3.4, DMG_BOLT=30, BOLT_WIND=0.9;
  var SPEC_V=176, SPEC_R=6.4, SPEC_SPLASH=W*0.44, SPEC_TIME=20, SPEC_LIFE=1.4;
  var DMG_ARROW=7, DMG_FLAME=10, DMG_ROCK=16, MAXHP=100;
  var HIT_R=10, INVULN=0.6, DYING=1.3;

  /* Fire is a magazine, not a laser. Each level buys a longer burst and an
     extra stream, and the magazine refills on its own, so the button is
     always tapped in bursts and never leaned on.
     `size` is how many volleys a full burst holds, `regen` how fast it comes
     back per second. Level 1 is deliberately tiny. */
  var POWER_MAX=4;
  function fireProfile(){
    if(G.power<=1) return {rate:0.115, streams:1, spread:0,     size:5,  regen:2.2};
    if(G.power===2) return {rate:0.095, streams:2, spread:0.09, size:10, regen:2.4};
    if(G.power===3) return {rate:0.078, streams:3, spread:0.11, size:18, regen:2.8};
    return            {rate:0.062, streams:3, spread:0.145,     size:36, regen:3.4};
  }
  /* Levels are gated on score, not on luck. A power orb never even appears
     until the next threshold is cleared, so picking one up always means it
     was earned and there is no such thing as a dud pickup. */
  var POWER_AT=[0, 50, 100, 200];
  function nextPowerAt(){ return G.power<POWER_MAX ? POWER_AT[G.power] : null; }
  function canLevel(){ return G.power<POWER_MAX && G.score>=POWER_AT[G.power]; }

  // drifting pickups, and the surge clock that decides where they appear
  var PICK_R=9, PICK_LIFE=11, PICK_V=60;
  var SURGE_FIRST=11, SURGE_MIN=8.5, SURGE_WARN=3.6;
  var LIVES_MAX=2;

  // the harrier: the first enemy that comes at you in the air
  var HARRIER_AFTER=45, DMG_HARRIER=18, HARRIER_TRACK=30;

  var G={ y:100, vy:0, wing:0, tilt:0, hp:MAXHP, invuln:0, flash:0, dyingT:0,
          foes:[], shots:[], flames:[], balls:[], blasts:[], ash:[], embers:[], picks:[],
          scroll:0, t:0, nextSpawn:0, score:0, best:0, spec:0, fireCd:0,
          power:1, burst:5, lives:0,
          surgeT:SURGE_FIRST, surgeDropped:false, surgeN:0,
          state:'ready', shake:0, shakeM:0, table:[], rank:-1, ridges:null,
          entry:null };
  try{ G.best=parseInt(localStorage.getItem('room-best')||'0',10)||0; }catch(e){}

  function gameReset(){
    G.y=100; G.vy=0; G.tilt=0; G.wing=0;
    G.hp=MAXHP; G.invuln=1.0; G.flash=0; G.dyingT=0;
    G.foes=[]; G.shots=[]; G.flames=[]; G.balls=[]; G.blasts=[]; G.ash=[]; G.embers=[];
    G.picks=[];
    G.t=0; G.nextSpawn=2.2; G.score=0; G.spec=0; G.fireCd=0;
    G.power=1; G.burst=fireProfile().size; G.lives=0; G.pickFlash=null;
    G.surgeT=SURGE_FIRST; G.surgeDropped=false; G.surgeN=0;
    G.state='ready'; G.shake=0; G.rank=-1; G.entry=null;
    if(!G.ridges) buildRidges();
  }
  function buildRidges(){
    function make(base,amp,step,n){ var a=[]; for(var i=0;i<=n;i++) a.push(base+Math.sin(i*step)*amp+Math.sin(i*step*2.3+1)*amp*0.4); return a; }
    G.ridges={ far:make(H*0.44,9,0.6,24), mid:make(H*0.58,12,0.85,22), near:make(H*0.80,13,1.1,18) };
    G.stars=[]; for(var i=0;i<70;i++) G.stars.push({x:Math.random()*W,y:Math.random()*(GY-16),s:0.3+Math.random()*1.3,b:Math.random()});
  }

  function pointsFor(t){ return t==='ballista'?5:(t==='harrier'?3:(t==='catapult'?2:1)); }
  function radiusFor(t){ return (t==='ballista'?30:(t==='harrier'?20:(t==='catapult'?26:16)))*SC; }
  function enemyTop(e){
    if(e.fly) return e.y;
    return GY-(e.type==='ballista'?34:(e.type==='catapult'?30:20))*SC;
  }
  function hpFor(t){ return t==='ballista'?3:(t==='harrier'?2:1); }

  function spawnFoe(){
    // The ballista is the thing to watch out for, so it stays rare and never
    // shows up in the opening seconds: a run should start readable and only
    // then get genuinely dangerous.
    var har = G.t<HARRIER_AFTER ? 0 : Math.min(0.18, (G.t-HARRIER_AFTER)*0.0045);
    var bal = G.t<20 ? 0 : Math.min(0.16, (G.t-20)*0.004);
    var cat=Math.min(0.34,G.t*0.009), fl=Math.min(0.28,G.t*0.006), r0=Math.random();
    var type = r0<har ? 'harrier'
             : r0<har+bal ? 'ballista'
             : r0<har+bal+cat ? 'catapult'
             : r0<har+bal+cat+fl ? 'flaming' : 'archer';
    var e={ type:type, x:W+22, alive:true, deathTimer:0, deathDur:0.45, burning:false,
      legPhase:Math.random()*10, hp:hpFor(type), hitT:0,
      shotCd: type==='ballista' ? (2.4+Math.random()) :
              type==='catapult' ? (1.6+Math.random()*1.2) : (0.7+Math.random()*0.9) };
    if(type==='harrier'){
      // Comes in at your altitude rather than shooting up at you, so the
      // answer is to move or to burn it, not to climb out of range.
      e.fly=true; e.y=clamp(G.y+(Math.random()*60-30),TOPM+6,BOTM-6);
      e.wing=Math.random()*6; e.peel=0; e.shotCd=1e9;
    }
    G.foes.push(e);
  }
  function cooldownFor(t){
    if(t==='harrier') return 1e9;
    if(t==='ballista') return Math.max(1.9,3.2-G.t*0.010)+Math.random()*0.5;
    if(t==='catapult') return Math.max(1.05,2.5-G.t*0.013)+Math.random()*0.7;
    if(t==='flaming')  return Math.max(0.7,1.5-G.t*0.012)+Math.random()*0.5;
    return Math.max(0.62,1.6-G.t*0.014)+Math.random()*0.5;
  }
  function foeShoot(e){
    var oy = GY-(e.type==='ballista'?46:(e.type==='catapult'?58:40))*SC;
    if(e.type==='ballista'){
      // Leads the target instead of aiming where you are, so hovering in one
      // place is the wrong answer and the bolt has to be dodged on purpose.
      var flight=Math.max(0.05,(e.x-DX)/BOLT_V);
      var aim=clamp(G.y+G.vy*flight*0.85, TOPM, BOTM);
      var bdx=DX-e.x, bdy=aim-oy, bl=Math.max(1,Math.hypot(bdx,bdy));
      G.shots.push({kind:'bolt',x:e.x,y:oy,vx:(bdx/bl)*BOLT_V,vy:(bdy/bl)*BOLT_V,
                    g:BOLT_G,dmg:DMG_BOLT,r:BOLT_R,age:0});
      G.shake=Math.max(G.shake,0.10); G.shakeM=2;
      return;
    }
    var dx=DX-e.x, dy=G.y-oy, L=Math.max(1,Math.hypot(dx,dy));
    if(e.type==='catapult'){
      var sp=ROCK_V+Math.min(G.t,70)*0.7;
      G.shots.push({kind:'rock',x:e.x,y:oy,vx:(dx/L)*sp,vy:(dy/L)*sp-30,g:ROCK_G,dmg:DMG_ROCK,r:ROCK_R,age:0});
    } else {
      var f=(e.type==='flaming');
      var sp2=ARROW_V+Math.min(G.t*1.5,74)+(f?20:0);
      G.shots.push({kind:f?'flame-arrow':'arrow',x:e.x,y:oy,vx:(dx/L)*sp2,vy:(dy/L)*sp2,
                    g:ARROW_G,dmg:f?DMG_FLAME:DMG_ARROW,r:ARROW_R,age:0});
    }
  }
  function puffAsh(x,y,n,f){
    n=n||8; f=f||1;
    for(var i=0;i<n;i++){ var a=Math.random()*6.28, sp=(16+Math.random()*28)*f;
      G.ash.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-12*f,life:0.35+Math.random()*0.25,age:0}); }
  }

  /* Pickups drift in from the right and bob. A surge drops one high on the
     screen a few seconds before the wave lands, so taking it means climbing
     out of position exactly when the screen is about to fill. */
  function dropPick(kind,y){
    G.picks.push({kind:kind, x:W+14, y:y, bob:Math.random()*6.28, age:0, life:PICK_LIFE});
  }
  function pickKind(){
    if(canLevel()) return 'power';
    if(G.lives<LIVES_MAX && Math.random()<0.25) return 'life';
    return 'heal';   // usually wanted by the time it crosses the screen
  }
  function takePick(pk){
    if(pk.kind==='power'){ G.power=Math.min(POWER_MAX,G.power+1); G.burst=fireProfile().size; }
    else if(pk.kind==='heal'){ G.hp=Math.min(MAXHP,G.hp+34); }
    else { G.lives=Math.min(LIVES_MAX,G.lives+1); }
    G.pickFlash={kind:pk.kind, t:1.1};
    for(var i=0;i<12;i++){ var a=Math.random()*6.28, sp=20+Math.random()*38;
      G.embers.push({x:pk.x,y:pk.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.4+Math.random()*0.3,age:0}); }
  }
  function surge(){
    G.surgeN++;
    var n=Math.min(5, 2+Math.floor(G.surgeN/2));
    for(var i=0;i<n;i++){ spawnFoe(); var e=G.foes[G.foes.length-1]; e.x=W+22+i*30; }
  }

  function mouth(){ return { x: DX + 70*SC, y: G.y - 4*SC }; }

  function fireSpecial(){
    if(G.state!=='play' || G.spec<100) return;
    G.spec=0;
    var m=mouth();
    G.balls.push({x:m.x,y:m.y,vx:Math.cos(FIRE_ANG)*SPEC_V,vy:Math.sin(FIRE_ANG)*SPEC_V,life:SPEC_LIFE,age:0});
  }
  function explode(x,y){
    G.blasts.push({x:x,y:y,age:0,life:0.6});
    G.shake=0.24; G.shakeM=4;
    puffAsh(x,y,16,2.1);
    for(var i=0;i<G.foes.length;i++){
      var e=G.foes[i];
      if(!e.alive) continue;
      if(Math.abs(x-e.x)<SPEC_SPLASH){
        e.alive=false; e.deathTimer=1.0; e.deathDur=1.0; e.burning=true;
        G.score+=pointsFor(e.type); puffAsh(e.x,enemyTop(e),10,1.6);
      }
    }
  }
  function hurt(d){
    if(G.invuln>0||G.state!=='play') return;
    G.hp-=d; G.invuln=INVULN; G.flash=0.25;
    if(G.hp<=0){
      if(G.lives>0){
        // A revive pack buys the run back once, but not for free: you lose a
        // power level, so a long run cannot be built purely on packs.
        G.lives--; G.hp=Math.round(MAXHP*0.6); G.invuln=1.8; G.flash=0.5;
        G.power=Math.max(1,G.power-1); G.burst=fireProfile().size;
        G.shots.length=0; G.shake=0.3; G.shakeM=5;
        puffAsh(DX,G.y,18,2.0);
        return;
      }
      G.hp=0; G.state='dying'; G.dyingT=DYING;
    }
  }
  /* Scores used to be bare numbers. They carry initials now, so anything
     already saved is migrated rather than thrown away. */
  function loadScores(){
    try{
      var a=JSON.parse(localStorage.getItem('room-scores')||'[]');
      if(!Array.isArray(a)) return [];
      return a.map(function(v){
        return (typeof v==='number') ? {n:'--', s:v} : {n:(v&&v.n)||'--', s:(v&&v.s)|0};
      });
    }catch(e){ return []; }
  }
  function saveScore(name,score){
    var a=loadScores(); a.push({n:name,s:score});
    a.sort(function(x,y){return y.s-x.s;}); a=a.slice(0,5);
    try{ localStorage.setItem('room-scores',JSON.stringify(a)); }catch(e){}
    return a;
  }
  function placesInTable(score){
    var a=loadScores();
    if(a.length<5) return true;
    for(var i=0;i<a.length;i++) if(score>a[i].s) return true;
    return false;
  }
  var ALPHA='ABCDEFGHIJKLMNOPQRSTUVWXYZ .-';
  function endRun(){
    if(G.score>G.best){ G.best=G.score; try{ localStorage.setItem('room-best',String(G.best)); }catch(e){} }
    if(G.score>0 && placesInTable(G.score)){
      // earned a slot, so take initials before showing the board
      G.state='entry';
      G.entry={ idx:[0,0], pos:0, blink:0 };
      return;
    }
    commitScore('--');
  }
  function commitScore(name){
    G.state='over';
    G.table=saveScore(name,G.score); G.rank=-1;
    for(var i=0;i<G.table.length;i++){
      if(G.table[i].s===G.score && G.table[i].n===name){ G.rank=i; break; }
    }
    G.entry=null;
  }
  function entryName(){
    if(!G.entry) return '--';
    return G.entry.idx.map(function(i){ return ALPHA.charAt(i); }).join('');
  }
  function entryMove(d){ if(!G.entry) return; G.entry.pos=(G.entry.pos+d+2)%2; }
  function entryCycle(d){
    if(!G.entry) return;
    var p=G.entry.pos;
    G.entry.idx[p]=(G.entry.idx[p]+d+ALPHA.length)%ALPHA.length;
  }
  function entryType(ch){
    if(!G.entry) return;
    var i=ALPHA.indexOf(ch.toUpperCase());
    if(i<0) return;
    G.entry.idx[G.entry.pos]=i;
    if(G.entry.pos<1) G.entry.pos++;
  }
  function entryConfirm(){
    if(!G.entry) return;
    if(G.entry.pos<1){ G.entry.pos=1; return; }
    commitScore(entryName());
  }

  function gameStep(dt){
    if(dt>0.05) dt=0.05;
    G.scroll += dt*SCROLLV;
    if(G.shake>0) G.shake=Math.max(0,G.shake-dt);
    if(G.invuln>0) G.invuln-=dt;
    if(G.flash>0) G.flash-=dt;

    for(var q=G.embers.length-1;q>=0;q--){ var em=G.embers[q]; em.age+=dt; em.x+=em.vx*dt; em.y+=em.vy*dt; if(em.age>em.life) G.embers.splice(q,1); }
    for(var w=G.ash.length-1;w>=0;w--){ var as=G.ash[w]; as.age+=dt; as.vy+=62*dt; as.x+=as.vx*dt; as.y+=as.vy*dt; if(as.age>as.life) G.ash.splice(w,1); }
    for(var bi=G.blasts.length-1;bi>=0;bi--){ G.blasts[bi].age+=dt; if(G.blasts[bi].age>G.blasts[bi].life) G.blasts.splice(bi,1); }

    if(G.state==='dying'){
      G.dyingT-=dt; G.vy+=GRAVA*2.4*dt; G.y+=G.vy*dt;
      G.tilt=Math.min(1.6,G.tilt+dt*2.2); G.wing+=dt*3;
      if(G.dyingT<=0||G.y>H+40) endRun();
      return;
    }
    if(G.state==='ready'){
      G.y=100+Math.sin(G.scroll*0.06)*5; G.tilt=Math.sin(G.scroll*0.06)*0.08; G.wing+=dt*6;
      if(keys.up||keys.use) G.state='play';
      return;
    }
    if(G.state!=='play') return;

    G.t+=dt;
    if(G.spec<100) G.spec=Math.min(100,G.spec+(dt/SPEC_TIME)*100);

    // flight
    if(keys.up){
      G.vy+=LIFTA*dt;
      if(Math.random()<0.35) G.embers.push({x:DX-14,y:G.y+(Math.random()*6-3),
        vx:-30-Math.random()*22,vy:(Math.random()*18-9),life:0.35+Math.random()*0.22,age:0});
    }
    G.vy+=GRAVA*dt;
    G.vy=Math.max(VUP,Math.min(VDN,G.vy));
    G.y+=G.vy*dt;
    if(G.y<TOPM){ G.y=TOPM; G.vy=0; }
    if(G.y>BOTM){ G.y=BOTM; G.vy=0; }
    G.tilt=Math.max(-0.4,Math.min(0.55,G.vy/190));
    G.wing+=dt*(keys.up?16:7);

    // special
    if(G.tapSpecial){ G.tapSpecial=false; fireSpecial(); }

    // fire: a magazine that empties fast and refills on its own. At level 1
    // that is about half a second of flame and then a wait; at level 4 it is
    // two solid seconds. The length of the burst IS the upgrade.
    var m=mouth();
    var prof=fireProfile();
    if(keys.use && G.burst>=1){
      G.fireCd-=dt;
      if(G.fireCd<=0){
        for(var fs=0; fs<prof.streams; fs++){
          var off=(prof.streams===1)?0:(fs-(prof.streams-1)/2)*prof.spread;
          var ang=FIRE_ANG+off+(Math.random()-0.5)*0.09;
          G.flames.push({x:m.x,y:m.y,vx:Math.cos(ang)*FIRE_V,vy:Math.sin(ang)*FIRE_V,life:FIRE_LIFE,age:0});
        }
        G.burst-=1;
        G.fireCd=prof.rate;
      }
    } else {
      G.burst=Math.min(prof.size, G.burst+prof.regen*dt);
    }
    if(G.pickFlash && G.pickFlash.t>0) G.pickFlash.t-=dt;

    // spawn, thinned out slightly because surges now carry the pressure
    G.nextSpawn-=dt;
    if(G.nextSpawn<=0){ spawnFoe(); G.nextSpawn=Math.max(0.62,1.8-G.t*0.017)+Math.random()*0.6; }

    // the surge clock
    G.surgeT-=dt;
    if(!G.surgeDropped && G.surgeT<=SURGE_WARN){
      G.surgeDropped=true;
      dropPick(pickKind(), TOPM+10+Math.random()*14);
    }
    if(G.surgeT<=0){
      surge();
      G.surgeDropped=false;
      G.surgeT=Math.max(SURGE_MIN, 14-G.surgeN*0.35)+Math.random()*2.5;
    }

    // pickups drift and bob; grabbing one is a proximity check
    for(var pi=G.picks.length-1;pi>=0;pi--){
      var pk=G.picks[pi];
      pk.age+=dt; pk.bob+=dt*2.4;
      pk.x-=PICK_V*dt;
      var pdx=pk.x-DX, pdy=(pk.y+Math.sin(pk.bob)*3)-G.y;
      if(pdx*pdx+pdy*pdy < (PICK_R+HIT_R)*(PICK_R+HIT_R)){ takePick(pk); G.picks.splice(pi,1); continue; }
      if(pk.x<-14||pk.age>pk.life) G.picks.splice(pi,1);
    }

    for(var i=G.foes.length-1;i>=0;i--){
      var e=G.foes[i];
      if(e.alive){
        if(e.fly){
          e.x -= (SCROLLV+34)*dt;
          e.wing+=dt*15;
          if(e.peel>0){ e.peel-=dt; e.y+=e.peelV*dt; }
          else {
            var want=G.y-e.y;
            e.y += Math.max(-HARRIER_TRACK,Math.min(HARRIER_TRACK,want*2.2))*dt;
          }
          e.y=clamp(e.y,TOPM+4,BOTM-4);
          if(e.peel<=0 && G.invuln<=0){
            var hdx=e.x-DX, hdy=e.y-G.y;
            if(hdx*hdx+hdy*hdy < (HIT_R+12)*(HIT_R+12)){
              hurt(DMG_HARRIER);
              e.peel=1.6; e.peelV=(hdy>=0?1:-1)*70;
            }
          }
        } else {
          e.x -= (e.type==='catapult'||e.type==='ballista'?SCROLLV:SCROLLV+16)*dt;
        }
        e.legPhase+=dt*7;
        if(e.hitT>0) e.hitT-=dt;
        if(!e.fly && e.x<W-4){ e.shotCd-=dt; if(e.shotCd<=0){ foeShoot(e); e.shotCd=cooldownFor(e.type); } }
      } else { e.deathTimer-=dt; if(e.fly) e.y+=90*dt; }
      if(e.x<-26||(!e.alive&&e.deathTimer<=0)) G.foes.splice(i,1);
    }

    // incoming
    for(var j=G.shots.length-1;j>=0;j--){
      var p=G.shots[j];
      if(!p) continue;                 // a revive inside hurt() empties this array
      p.age+=dt; p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(G.invuln<=0){
        var dx=p.x-DX, dy=p.y-G.y, rr=p.r+HIT_R;
        if(dx*dx+dy*dy<rr*rr){ hurt(p.dmg); if(j<G.shots.length) G.shots.splice(j,1); continue; }
      }
      if(p.age>3.5||p.x<-18||p.y>H+20) G.shots.splice(j,1);
    }

    // breath
    for(var f2=G.flames.length-1;f2>=0;f2--){
      var fl=G.flames[f2];
      fl.age+=dt; fl.vy+=FIRE_G*dt; fl.x+=fl.vx*dt; fl.y+=fl.vy*dt;
      if(fl.age>fl.life||fl.y>GY+10||fl.x>W+10){ G.flames.splice(f2,1); continue; }
      for(var k=0;k<G.foes.length;k++){
        var e2=G.foes[k];
        if(!e2.alive) continue;
        var ex=fl.x-e2.x, ey=fl.y-enemyTop(e2), er=FLAME_R+radiusFor(e2.type);
        if(ex*ex+ey*ey<er*er){
          // Armoured targets soak several flames. Consuming the flame on a
          // hit is what makes that cost real, otherwise one breath frame
          // sprays the whole stream into the same enemy and it dies instantly.
          if(e2.hp>1){ e2.hp--; e2.hitT=0.16; puffAsh(fl.x,fl.y,3,0.7); G.flames.splice(f2,1); break; }
          e2.alive=false; e2.deathTimer=0.45; e2.deathDur=0.45; e2.burning=false;
          G.score+=pointsFor(e2.type); puffAsh(e2.x,enemyTop(e2),8,1);
        }
      }
    }

    // charged fireball
    for(var b=G.balls.length-1;b>=0;b--){
      var bl=G.balls[b];
      bl.age+=dt; bl.vy+=FIRE_G*0.7*dt; bl.x+=bl.vx*dt; bl.y+=bl.vy*dt;
      var hit=false;
      for(var n=0;n<G.foes.length;n++){
        var e3=G.foes[n]; if(!e3.alive) continue;
        var hx=bl.x-e3.x, hy=bl.y-enemyTop(e3), hr=SPEC_R+radiusFor(e3.type);
        if(hx*hx+hy*hy<hr*hr){ hit=true; break; }
      }
      if(hit||bl.age>bl.life||bl.y>GY+4||bl.x>W+10){ explode(bl.x,Math.min(bl.y,GY)); G.balls.splice(b,1); }
    }
  }
  /* ---------- drawing ---------- */
  function smoothShape(pts){
    var n=pts.length;
    function mid(a,b){ return {x:(a.x+b.x)/2,y:(a.y+b.y)/2}; }
    var st=mid(pts[n-1],pts[0]);
    ctx.beginPath(); ctx.moveTo(st.x,st.y);
    for(var i=0;i<n;i++){ var c=pts[i], nx=pts[(i+1)%n], m=mid(c,nx); ctx.quadraticCurveTo(c.x,c.y,m.x,m.y); }
    ctx.closePath();
  }

  function drawDragon(){
    ctx.save();
    ctx.translate(DX,G.y);
    ctx.rotate(G.tilt*0.5);
    ctx.scale(SC,SC);
    if(G.invuln>0 && G.state==='play')
      ctx.globalAlpha=0.62+0.38*(0.5+0.5*Math.sin(G.invuln*26));

    var flap=Math.sin(G.wing);
    // Night needs a brighter ramp and a hotter rim than the original daylight
    // build, or a black wyrm on a black sky just disappears.
    var rim = keys.up ? 'rgba(255,231,178,0.85)' : 'rgba(198,214,255,0.55)';
    var bodyG=ctx.createLinearGradient(-20,-16,40,10);
    bodyG.addColorStop(0,'#5A5570'); bodyG.addColorStop(0.55,'#2C2A38'); bodyG.addColorStop(1,'#121218');

    // tail
    ctx.fillStyle=bodyG;
    smoothShape([{x:-26,y:-5},{x:-42,y:-8},{x:-60,y:-7},{x:-76,y:-2},{x:-90,y:4},
                 {x:-84,y:9},{x:-68,y:8},{x:-50,y:7},{x:-32,y:6}]);
    ctx.fill();
    ctx.strokeStyle=rim; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='#0d0d11';
    smoothShape([{x:-90,y:2},{x:-101,y:-5},{x:-96,y:4},{x:-101,y:12},{x:-90,y:6}]);
    ctx.fill();
    ctx.fillStyle='#151018';
    for(var i=0;i<3;i++){ var sx=-40-i*16;
      ctx.beginPath(); ctx.moveTo(sx,-7); ctx.lineTo(sx+3,-12); ctx.lineTo(sx+6,-7); ctx.closePath(); ctx.fill(); }

    function wingPath(sh,t1,t2,t3,bk,bow){
      ctx.beginPath(); ctx.moveTo(sh.x,sh.y);
      ctx.quadraticCurveTo(sh.x-12*bow,(sh.y+t1.y)/2,t1.x,t1.y);
      ctx.quadraticCurveTo((t1.x+t2.x)/2+6,(t1.y+t2.y)/2+4,t2.x,t2.y);
      ctx.quadraticCurveTo((t2.x+t3.x)/2+5,(t2.y+t3.y)/2+3,t3.x,t3.y);
      ctx.quadraticCurveTo((t3.x+bk.x)/2+3,(t3.y+bk.y)/2+2,bk.x,bk.y);
      ctx.closePath();
    }

    // far wing
    wingPath({x:6,y:-9},{x:12,y:-38-flap*17},{x:24,y:-32-flap*13},{x:29,y:-19-flap*7},{x:16,y:-9},1);
    ctx.fillStyle='rgba(26,26,38,0.72)'; ctx.fill();

    // body
    ctx.fillStyle=bodyG;
    smoothShape([{x:-28,y:-4},{x:-14,y:-10},{x:0,y:-12},{x:14,y:-12},{x:24,y:-14},
                 {x:33,y:-11},{x:40,y:-6},{x:44,y:-1},
                 {x:41,y:3},{x:32,y:6},{x:18,y:7},{x:2,y:7},{x:-12,y:6},{x:-24,y:4},{x:-28,y:3}]);
    ctx.fill();
    ctx.strokeStyle=rim; ctx.lineWidth=1.2; ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1;
    for(var b2=0;b2<4;b2++){ ctx.beginPath(); ctx.moveTo(-16+b2*13,4); ctx.lineTo(-13+b2*13,7); ctx.stroke(); }
    ctx.strokeStyle='rgba(226,236,255,0.22)';
    for(var c2=0;c2<3;c2++){ var cx2=-10+c2*13;
      ctx.beginPath(); ctx.moveTo(cx2,-3); ctx.quadraticCurveTo(cx2+5,-1,cx2+9,-3.5); ctx.stroke(); }
    ctx.fillStyle='#0d0d11';
    for(var d2=0;d2<4;d2++){ var dx2=-12+d2*11;
      ctx.beginPath(); ctx.moveTo(dx2,-11); ctx.lineTo(dx2+3.5,-18-d2*0.6); ctx.lineTo(dx2+7,-11); ctx.closePath(); ctx.fill(); }

    // legs
    ctx.fillStyle='#0d0d11';
    smoothShape([{x:-20,y:5},{x:-14,y:2},{x:-8,y:4},{x:-10,y:10},{x:-18,y:10}]); ctx.fill();
    ctx.strokeStyle='#0d0d11'; ctx.lineWidth=1.4; ctx.lineCap='round';
    [-16,-13,-10].forEach(function(cx){ ctx.beginPath(); ctx.moveTo(cx,9); ctx.lineTo(cx-1,13); ctx.stroke(); });
    ctx.fillStyle='#0d0d11';
    smoothShape([{x:16,y:3},{x:22,y:1.5},{x:27,y:4},{x:24,y:9},{x:17,y:8}]); ctx.fill();
    [20,23,26].forEach(function(cx){ ctx.beginPath(); ctx.moveTo(cx,8.5); ctx.lineTo(cx,12); ctx.stroke(); });

    // near wing
    var sh={x:10,y:-10}, t1={x:20,y:-50-flap*22}, t2={x:38,y:-41-flap*17}, t3={x:46,y:-22-flap*9}, bk={x:23,y:-10};
    wingPath(sh,t1,t2,t3,bk,1.3);
    var wg=ctx.createLinearGradient(sh.x,sh.y,t1.x,t1.y);
    wg.addColorStop(0,'#3B3550'); wg.addColorStop(1,'#14141E');
    ctx.fillStyle=wg; ctx.fill();
    ctx.strokeStyle=rim; ctx.lineWidth=1; ctx.stroke();
    ctx.strokeStyle='rgba(255,231,178,0.6)'; ctx.lineWidth=1.4;
    [t1,t2,t3].forEach(function(t){ ctx.beginPath(); ctx.moveTo(sh.x,sh.y); ctx.lineTo(t.x,t.y); ctx.stroke(); });

    // head
    ctx.fillStyle=bodyG;
    smoothShape([{x:32,y:-7},{x:42,y:-16},{x:54,y:-19},{x:66,y:-14},{x:73,y:-6},
                 {x:70,y:1},{x:60,y:4},{x:48,y:4},{x:38,y:2}]);
    ctx.fill();
    ctx.strokeStyle=rim; ctx.lineWidth=1.1; ctx.stroke();
    ctx.fillStyle='#0d0d11';
    smoothShape([{x:53,y:-19},{x:41,y:-33},{x:49,y:-20},{x:59,y:-21}]); ctx.fill();
    smoothShape([{x:44,y:-15},{x:46,y:-22},{x:50,y:-15},{x:47,y:-14}]); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(46,1); ctx.quadraticCurveTo(60,5,70,0); ctx.stroke();
    ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(68,-2,1.2,0,6.3); ctx.fill();
    ctx.fillStyle='#d8e86a';
    smoothShape([{x:53,y:-13},{x:60,y:-16},{x:66,y:-11},{x:59,y:-7}]); ctx.fill();
    ctx.strokeStyle='#161616'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(56,-12); ctx.quadraticCurveTo(60,-10.3,64,-12); ctx.stroke();

    if(G.flash>0){
      ctx.globalAlpha=Math.min(1,G.flash/0.25)*0.55;
      ctx.fillStyle='#ff3a2a';
      ctx.beginPath(); ctx.ellipse(6,-2,34,16,0,0,6.3); ctx.fill();
    }
    ctx.restore();
  }

  function drawFoeArcher(e){
    ctx.save(); ctx.translate(e.x,GY); ctx.scale(SC,SC);
    var fl=(e.type==='flaming');
    if(!e.alive){ var t=1-Math.max(0,e.deathTimer)/(e.deathDur||0.45);
      ctx.globalAlpha=1-t; ctx.rotate(t*1.4); ctx.translate(0,t*6); }
    var stride=Math.sin(e.legPhase)*(e.alive?5.5:0);
    var tunic=fl?'#8a3a2a':'#4a5a38', trim=fl?'#5a2418':'#2e3a20';
    ctx.strokeStyle='#2a2119'; ctx.lineWidth=4.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-3,-23); ctx.lineTo(-3+stride,0); ctx.moveTo(3,-23); ctx.lineTo(3-stride,0); ctx.stroke();
    ctx.fillStyle=tunic;
    ctx.beginPath(); ctx.moveTo(-9,-23); ctx.lineTo(9,-23); ctx.lineTo(7,-39); ctx.lineTo(-7,-39); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=trim; ctx.lineWidth=1.4; ctx.stroke();
    ctx.fillStyle='#5a3f24';
    ctx.beginPath(); ctx.ellipse(-8,-34,3.4,9,-0.15,0,6.3); ctx.fill();
    var draw=e.alive?Math.max(0,1-e.shotCd/1.1)*0.55:0;
    ctx.strokeStyle='#3c2c1c'; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(11,-41); ctx.quadraticCurveTo(20+draw*3,-30,11,-18); ctx.stroke();
    ctx.strokeStyle=fl?'#ffb066':'#b9b3a2'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(11,-41); ctx.lineTo(11-draw*7,-30); ctx.lineTo(11,-18); ctx.stroke();
    ctx.strokeStyle=tunic; ctx.lineWidth=3.4;
    ctx.beginPath(); ctx.moveTo(6,-33); ctx.lineTo(11-draw*7,-30); ctx.moveTo(6,-33); ctx.lineTo(11,-30); ctx.stroke();
    ctx.fillStyle='#c19a6d'; ctx.beginPath(); ctx.arc(0,-44,6.5,0,6.3); ctx.fill();
    ctx.fillStyle=fl?'#7a2c1c':'#3c4428';
    ctx.beginPath(); ctx.arc(0,-46,7,Math.PI,0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,-40.5,7,2.4,0,0,6.3); ctx.fill();
    if(fl){ var fk=1+Math.sin(e.legPhase*3)*0.15;
      ctx.fillStyle='rgba(255,150,50,0.9)';
      ctx.beginPath(); ctx.moveTo(0,-52); ctx.quadraticCurveTo(4*fk,-58,0,-64*fk); ctx.quadraticCurveTo(-4*fk,-58,0,-52); ctx.closePath(); ctx.fill(); }
    if(e.burning&&!e.alive) burnFx(e.legPhase,-30);
    ctx.restore();
  }
  function burnFx(seed,my){
    var fk=1+Math.sin(seed*9)*0.2;
    for(var i=0;i<3;i++){ var fx=(i-1)*6;
      var g=ctx.createRadialGradient(fx,my,0,fx,my,14*fk);
      g.addColorStop(0,'rgba(255,230,160,0.9)'); g.addColorStop(0.5,'rgba(255,140,40,0.7)'); g.addColorStop(1,'rgba(255,90,20,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(fx,my-i*3,14*fk,0,6.3); ctx.fill(); }
  }
  function drawFoeCatapult(e){
    ctx.save(); ctx.translate(e.x,GY); ctx.scale(SC,SC);
    if(!e.alive){ var t=1-Math.max(0,e.deathTimer)/(e.deathDur||0.45); ctx.globalAlpha=1-t; ctx.translate(0,t*10); }
    ctx.strokeStyle='#2e2214'; ctx.lineWidth=3; ctx.fillStyle='#4a3826';
    [-16,16].forEach(function(wx){ ctx.beginPath(); ctx.arc(wx,-8,9,0,6.3); ctx.fill(); ctx.stroke(); });
    ctx.strokeStyle='#57402a'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-20,-6); ctx.lineTo(-8,-30); ctx.moveTo(20,-6); ctx.lineTo(8,-30); ctx.moveTo(-20,-6); ctx.lineTo(20,-6); ctx.stroke();
    var t2=e.alive?Math.max(0,1-e.shotCd/1.6):0.15;
    ctx.save(); ctx.translate(0,-22); ctx.rotate(-0.3-t2*1.5);
    ctx.strokeStyle='#3c2c1c'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-34); ctx.stroke();
    ctx.fillStyle='#6a635a'; ctx.beginPath(); ctx.arc(0,-37,7,0,6.3); ctx.fill();
    ctx.restore();
    if(e.burning&&!e.alive) burnFx(e.legPhase+e.x*0.1,-22);
    ctx.restore();
  }

  /* The ballista. Heavy, slow, armoured, and it aims where you are going
     rather than where you are. It telegraphs: the windlass cranks back and a
     thin sight line reaches out across the screen for the last stretch of its
     cooldown, so getting hit is a decision you made rather than a surprise. */
  function drawFoeBallista(e){
    var wind = e.alive ? Math.max(0, 1 - e.shotCd/BOLT_WIND) : 0;
    ctx.save(); ctx.translate(e.x,GY); ctx.scale(SC,SC);
    if(!e.alive){ var t=1-Math.max(0,e.deathTimer)/(e.deathDur||0.45); ctx.globalAlpha=1-t; ctx.translate(0,t*10); }

    // carriage: two heavy wheels and a plated deck
    ctx.strokeStyle='#22190F'; ctx.lineWidth=3.4; ctx.fillStyle='#3A2C1B';
    [-20,20].forEach(function(wx){
      ctx.beginPath(); ctx.arc(wx,-11,12,0,6.3); ctx.fill(); ctx.stroke();
      ctx.strokeStyle='#57402A'; ctx.lineWidth=2;
      for(var s=0;s<4;s++){ var a=e.legPhase*0.4+s*0.785;
        ctx.beginPath(); ctx.moveTo(wx-Math.cos(a)*9,-11-Math.sin(a)*9);
        ctx.lineTo(wx+Math.cos(a)*9,-11+Math.sin(a)*9); ctx.stroke(); }
      ctx.strokeStyle='#22190F'; ctx.lineWidth=3.4;
    });
    ctx.fillStyle='#4C3A25';
    ctx.beginPath(); ctx.moveTo(-26,-20); ctx.lineTo(26,-20); ctx.lineTo(22,-30); ctx.lineTo(-22,-30); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#2A1F12'; ctx.lineWidth=1.6; ctx.stroke();
    // iron banding
    ctx.fillStyle='#6E7076';
    [-14,0,14].forEach(function(bx){ r(bx-2,-30,4,10,'#6E7076'); });

    // the frame and the bow arms
    ctx.strokeStyle='#3A2C1B'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(0,-46); ctx.stroke();
    ctx.strokeStyle='#5A4326'; ctx.lineWidth=4.6;
    ctx.beginPath();
    ctx.moveTo(-4,-64); ctx.quadraticCurveTo(6,-58,-2,-50);
    ctx.moveTo(-4,-28); ctx.quadraticCurveTo(6,-34,-2,-42);
    ctx.stroke();
    // stock running forward, with the bolt still in the groove
    ctx.strokeStyle='#43331F'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(-12,-46); ctx.lineTo(26,-46); ctx.stroke();
    ctx.strokeStyle='#7E8288'; ctx.lineWidth=1.4;
    var pull = -6 - wind*10;
    ctx.beginPath(); ctx.moveTo(-4,-64); ctx.lineTo(pull,-46); ctx.lineTo(-4,-28); ctx.stroke();
    if(wind<1){
      ctx.strokeStyle='#8A8F96'; ctx.lineWidth=2.6; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(pull,-46); ctx.lineTo(26+wind*4,-46); ctx.stroke();
      ctx.fillStyle='#C6CBD2';
      ctx.beginPath(); ctx.moveTo(32+wind*4,-46); ctx.lineTo(24+wind*4,-49.5); ctx.lineTo(24+wind*4,-42.5); ctx.closePath(); ctx.fill();
    }
    // windlass crank at the back, turning as it draws
    ctx.save(); ctx.translate(-14,-38); ctx.rotate(wind*5.4);
    ctx.strokeStyle='#6E7076'; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(-6,0); ctx.lineTo(6,0); ctx.moveTo(0,-6); ctx.lineTo(0,6); ctx.stroke();
    ctx.restore();
    // crew, so the scale reads
    ctx.fillStyle='#3E4A2E';
    ctx.beginPath(); ctx.moveTo(-30,-20); ctx.lineTo(-22,-20); ctx.lineTo(-23,-36); ctx.lineTo(-29,-36); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#C19A6D'; ctx.beginPath(); ctx.arc(-26,-40,4.6,0,6.3); ctx.fill();
    ctx.fillStyle='#2E3A20'; ctx.beginPath(); ctx.arc(-26,-41.5,5,Math.PI,0); ctx.fill();

    // a hooded lamp on the frame, so this one is picked out of the dark and
    // you can read the wind-up from across the screen
    var lam=0.35+wind*0.65;
    var lg=ctx.createRadialGradient(10,-56,0,10,-56,16);
    lg.addColorStop(0,'rgba(255,150,70,'+(0.85*lam)+')'); lg.addColorStop(1,'rgba(255,110,40,0)');
    ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(10,-56,16,0,6.3); ctx.fill();
    ctx.fillStyle='#2A2018'; r(8,-60,5,7,'#2A2018');
    ctx.fillStyle='rgba(255,190,110,'+(0.5+lam*0.5)+')'; r(9,-59,3,5,'rgba(255,190,110,'+(0.5+lam*0.5)+')');

    if(e.hitT>0){ ctx.globalAlpha=Math.min(1,e.hitT/0.16)*0.75; ctx.fillStyle='#FFD9A0';
      ctx.beginPath(); ctx.ellipse(0,-38,30,26,0,0,6.3); ctx.fill(); ctx.globalAlpha=1; }
    if(e.burning&&!e.alive) burnFx(e.legPhase+e.x*0.1,-34);
    ctx.restore();

    // damage pips above it, so three hits is visible rather than guessed at
    if(e.alive && e.hp<hpFor('ballista')){
      for(var p=0;p<hpFor('ballista');p++)
        r(e.x-8+p*6, GY-78*SC, 4, 2.2, p<e.hp?'#E8A63F':'rgba(130,120,110,0.45)');
    }
    // the sight line, only while it is actually about to loose
    if(e.alive && wind>0.45){
      var oy=GY-46*SC, fh=Math.max(0.05,(e.x-DX)/BOLT_V);
      var aim=clamp(G.y+G.vy*fh*0.85, TOPM, BOTM);
      ctx.save();
      ctx.globalAlpha=(wind-0.45)/0.55*0.7;
      ctx.strokeStyle='#FF6B4A'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(e.x-4,oy); ctx.lineTo(DX,aim); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
    }
  }

  /* The harrier: a rider on a war hawk. It needs a warm point of light or a
     dark bird on a dark sky is invisible, which is the same lesson the
     ballista's lamp taught. */
  function drawFoeHarrier(e){
    ctx.save(); ctx.translate(e.x,e.y); ctx.scale(SC,SC);
    if(!e.alive){ var t=1-Math.max(0,e.deathTimer)/(e.deathDur||0.45);
      ctx.globalAlpha=1-t; ctx.rotate(t*1.9); }
    var f=Math.sin(e.wing);
    // far wing first so the body overlaps it
    ctx.fillStyle='#1B1D28';
    ctx.beginPath(); ctx.moveTo(2,-4);
    ctx.quadraticCurveTo(-16,-14-f*16,-30,-4-f*10); ctx.quadraticCurveTo(-14,2,2,4); ctx.closePath(); ctx.fill();
    // body and tail
    ctx.fillStyle='#33323F';
    ctx.beginPath(); ctx.ellipse(0,0,17,7,0,0,6.3); ctx.fill();
    ctx.fillStyle='#22222C';
    ctx.beginPath(); ctx.moveTo(-14,-2); ctx.lineTo(-30,-7); ctx.lineTo(-30,6); ctx.lineTo(-14,3); ctx.closePath(); ctx.fill();
    // head and beak, facing the dragon
    ctx.fillStyle='#3C3B49'; ctx.beginPath(); ctx.arc(16,-3,6.4,0,6.3); ctx.fill();
    ctx.fillStyle='#E0A23C'; ctx.beginPath();
    ctx.moveTo(27,-3); ctx.lineTo(20,-6); ctx.lineTo(20,1); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#FFDF7A'; ctx.beginPath(); ctx.arc(18,-5,1.7,0,6.3); ctx.fill();
    // rider
    ctx.fillStyle='#4A5A38';
    ctx.beginPath(); ctx.moveTo(-2,-6); ctx.lineTo(6,-6); ctx.lineTo(4,-18); ctx.lineTo(-1,-18); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#C19A6D'; ctx.beginPath(); ctx.arc(2,-21,4.6,0,6.3); ctx.fill();
    ctx.fillStyle='#2E3A20'; ctx.beginPath(); ctx.arc(2,-22.5,5,Math.PI,0); ctx.fill();
    // near wing, over the body
    ctx.fillStyle='#2A2A36';
    ctx.beginPath(); ctx.moveTo(2,-2);
    ctx.quadraticCurveTo(-14,10+f*18,-28,4+f*12); ctx.quadraticCurveTo(-12,6,2,5); ctx.closePath(); ctx.fill();
    // the lantern the rider carries, so it reads against the night
    var lg=ctx.createRadialGradient(-4,-16,0,-4,-16,15);
    lg.addColorStop(0,'rgba(255,160,70,0.85)'); lg.addColorStop(1,'rgba(255,120,40,0)');
    ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(-4,-16,15,0,6.3); ctx.fill();
    ctx.fillStyle='#FFC978'; r(-6,-18,4,5,'#FFC978');
    if(e.hitT>0){ ctx.globalAlpha=Math.min(1,e.hitT/0.16)*0.7; ctx.fillStyle='#FFD9A0';
      ctx.beginPath(); ctx.ellipse(0,-6,26,20,0,0,6.3); ctx.fill(); ctx.globalAlpha=1; }
    if(e.burning&&!e.alive) burnFx(e.legPhase,-6);
    ctx.restore();
    if(e.alive && e.hp<hpFor('harrier')){
      for(var q=0;q<hpFor('harrier');q++)
        r(e.x-5+q*6, e.y-16, 4, 2, q<e.hp?'#E8A63F':'rgba(130,120,110,0.45)');
    }
  }

  /* The floaty things. Amber raises your fire, green heals, blue buys you a
     second run. All three glow, because they are meant to pull you off your
     line and you have to be able to see them from across the screen. */
  function drawPick(pk){
    var y=pk.y+Math.sin(pk.bob)*3;
    var col = pk.kind==='power' ? ['#FFD24A','#E8892A'] :
              pk.kind==='heal'  ? ['#8CE6A6','#2E9B57'] : ['#9CC8FF','#3A6FD0'];
    var pulse=0.75+Math.sin(pk.bob*1.7)*0.25;
    var fade = pk.age>pk.life-2 ? Math.max(0,(pk.life-pk.age)/2) : 1;
    ctx.save(); ctx.globalAlpha=fade;
    var g=ctx.createRadialGradient(pk.x,y,0,pk.x,y,16*pulse);
    g.addColorStop(0,col[0]); g.addColorStop(0.28,col[1]); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=0.5*fade; ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(pk.x,y,16*pulse,0,6.3); ctx.fill();
    ctx.globalAlpha=fade;
    ctx.fillStyle=col[1]; ctx.beginPath(); ctx.arc(pk.x,y,6.4,0,6.3); ctx.fill();
    ctx.fillStyle=col[0]; ctx.beginPath(); ctx.arc(pk.x,y,4.6,0,6.3); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(pk.x-1.6,y-1.8,1.5,0,6.3); ctx.fill();
    // a glyph so the three are told apart at a glance
    if(pk.kind==='power'){
      // a double chevron pointing up: more fire
      ctx.strokeStyle='#20160A'; ctx.lineWidth=1.3; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(pk.x-2.6,y+0.4); ctx.lineTo(pk.x,y-2.4); ctx.lineTo(pk.x+2.6,y+0.4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pk.x-2.6,y+3.2); ctx.lineTo(pk.x,y+0.4); ctx.lineTo(pk.x+2.6,y+3.2); ctx.stroke();
    }
    else if(pk.kind==='heal'){ r(pk.x-2.8,y-0.9,5.6,1.8,'#0B2A16'); r(pk.x-0.9,y-2.8,1.8,5.6,'#0B2A16'); }
    else { r(pk.x-2.6,y-2.2,5.2,1.7,'#0A1A34'); r(pk.x-2.6,y+0.6,5.2,1.7,'#0A1A34'); }
    ctx.restore();
  }

  function ridgeLayer(pts,sf,col,al){
    var segW=W/(pts.length-6), shift=(G.scroll*sf)%segW, v=[];
    for(var i=0;i<pts.length;i++) v.push({x:-segW*2+i*segW-shift,y:pts[i]});
    ctx.save(); ctx.globalAlpha=al===undefined?1:al; ctx.fillStyle=col;
    ctx.beginPath(); ctx.moveTo(v[0].x,H); ctx.lineTo(v[0].x,v[0].y);
    for(var j=1;j<v.length;j++){ var pv=v[j-1],cu=v[j];
      ctx.quadraticCurveTo(pv.x,pv.y,(pv.x+cu.x)/2,(pv.y+cu.y)/2); }
    var last=v[v.length-1];
    ctx.lineTo(last.x,last.y); ctx.lineTo(last.x,H); ctx.closePath(); ctx.fill(); ctx.restore();
  }

  function gameRender(){
    var sx=G.shake>0?(Math.random()-0.5)*G.shakeM:0, sy=G.shake>0?(Math.random()-0.5)*G.shakeM:0;
    ctx.save(); ctx.translate(sx,sy);
    if(!G.ridges) buildRidges();

    // night sky
    var g=ctx.createLinearGradient(0,-8,0,H+8);
    g.addColorStop(0,'#080C1A'); g.addColorStop(0.5,'#101A33'); g.addColorStop(1,'#25314A');
    ctx.fillStyle=g; ctx.fillRect(-8,-8,W+16,H+16);
    for(var i=0;i<G.stars.length;i++){ var st=G.stars[i];
      ctx.globalAlpha=0.2+st.b*0.6; r(st.x,st.y,st.s>1?2:1,st.s>1?2:1,st.b>0.7?'#CFE2FF':'#FFF'); }
    ctx.globalAlpha=1;
    // moon
    var mx=W*0.82,my=H*0.18;
    var mg=ctx.createRadialGradient(mx,my,2,mx,my,44);
    mg.addColorStop(0,'rgba(214,228,255,0.35)'); mg.addColorStop(1,'rgba(214,228,255,0)');
    ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(mx,my,44,0,6.3); ctx.fill();
    ctx.fillStyle='#E4EBF7'; ctx.beginPath(); ctx.arc(mx,my,11,0,6.3); ctx.fill();
    ctx.fillStyle='rgba(150,168,200,0.35)';
    ctx.beginPath(); ctx.arc(mx-3,my-2,2.4,0,6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(mx+4,my+3,1.8,0,6.3); ctx.fill();

    ridgeLayer(G.ridges.far,0.10,'#141C31',1);
    ridgeLayer(G.ridges.mid,0.22,'#0E1729',1);
    ridgeLayer(G.ridges.near,0.42,'#0A1120',1);

    // ground
    var gg=ctx.createLinearGradient(0,GY,0,H);
    gg.addColorStop(0,'#2A2416'); gg.addColorStop(1,'#15110A');
    ctx.fillStyle=gg; ctx.fillRect(-8,GY,W+16,H-GY+8);
    ctx.fillStyle='#22331E';
    ctx.beginPath(); ctx.moveTo(-8,GY);
    for(var x=-8;x<=W+12;x+=5){ var px=x-(G.scroll%10);
      ctx.lineTo(px,GY-(2.5+Math.sin(px*0.25)*1.2)); ctx.lineTo(px+2.5,GY); }
    ctx.lineTo(W+8,GY); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.22)';
    for(var x2=-30;x2<W+30;x2+=27){ var qx=x2-(G.scroll%27);
      ctx.beginPath(); ctx.ellipse(qx,GY+14,9,3,0,0,6.3); ctx.fill(); }

    for(var e1=0;e1<G.foes.length;e1++){ var e=G.foes[e1];
      if(e.type==='harrier') drawFoeHarrier(e);
      else if(e.type==='ballista') drawFoeBallista(e);
      else if(e.type==='catapult') drawFoeCatapult(e);
      else drawFoeArcher(e); }
    for(var pq=0;pq<G.picks.length;pq++) drawPick(G.picks[pq]);

    // incoming
    for(var s2=0;s2<G.shots.length;s2++){ var p=G.shots[s2];
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(Math.atan2(p.vy,p.vx));
      if(p.kind==='rock'){
        ctx.fillStyle='#5b5750';
        ctx.beginPath(); ctx.moveTo(-4,-2.6); ctx.lineTo(2.6,-3.4); ctx.lineTo(4,1); ctx.lineTo(-1,4); ctx.lineTo(-4,1.3); ctx.closePath(); ctx.fill();
      } else if(p.kind==='bolt'){
        // long, heavy and moving fast enough to need a streak behind it
        ctx.strokeStyle='rgba(255,150,90,0.30)'; ctx.lineWidth=2.6; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(-22,0); ctx.lineTo(-9,0); ctx.stroke();
        ctx.strokeStyle='#3A2A18'; ctx.lineWidth=2.2;
        ctx.beginPath(); ctx.moveTo(-11,0); ctx.lineTo(4,0); ctx.stroke();
        ctx.fillStyle='#6A5236';
        ctx.beginPath(); ctx.moveTo(-11,0); ctx.lineTo(-14.5,-2.6); ctx.lineTo(-14.5,2.6); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#D5DBE2';
        ctx.beginPath(); ctx.moveTo(8,0); ctx.lineTo(3,-2.8); ctx.lineTo(3,2.8); ctx.closePath(); ctx.fill();
      } else {
        var fa=(p.kind==='flame-arrow');
        ctx.strokeStyle='#4a3a28'; ctx.lineWidth=1.4; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(-7,0); ctx.lineTo(2.6,0); ctx.stroke();
        ctx.fillStyle='#9aa0a8'; ctx.beginPath(); ctx.moveTo(2.6,0); ctx.lineTo(0,-1.2); ctx.lineTo(0,1.2); ctx.closePath(); ctx.fill();
        if(fa){ var fg2=ctx.createRadialGradient(-7,0,0,-7,0,5);
          fg2.addColorStop(0,'rgba(255,220,140,0.95)'); fg2.addColorStop(1,'rgba(255,90,20,0)');
          ctx.fillStyle=fg2; ctx.beginPath(); ctx.arc(-7,0,5,0,6.3); ctx.fill(); }
      }
      ctx.restore();
    }

    // breath
    for(var f3=0;f3<G.flames.length;f3++){ var fl=G.flames[f3];
      var a=1-fl.age/fl.life, rr=2.6+a*4;
      var gl=ctx.createRadialGradient(fl.x,fl.y,0,fl.x,fl.y,rr*2.1);
      gl.addColorStop(0,'rgba(255,90,20,'+(a*0.5)+')'); gl.addColorStop(1,'rgba(255,90,20,0)');
      ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(fl.x,fl.y,rr*2.1,0,6.3); ctx.fill();
      var fg=ctx.createRadialGradient(fl.x,fl.y,0,fl.x,fl.y,rr);
      fg.addColorStop(0,'rgba(255,250,200,'+a+')'); fg.addColorStop(0.35,'rgba(255,168,20,'+a+')');
      fg.addColorStop(0.75,'rgba(255,69,20,'+(a*0.95)+')'); fg.addColorStop(1,'rgba(200,20,10,0)');
      ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(fl.x,fl.y,rr,0,6.3); ctx.fill(); }

    // fireball
    for(var b3=0;b3<G.balls.length;b3++){ var bl=G.balls[b3];
      var ta=Math.atan2(bl.vy,bl.vx);
      for(var tr=1;tr<=3;tr++){ ctx.fillStyle='rgba(255,110,30,'+(0.35/tr)+')';
        ctx.beginPath(); ctx.arc(bl.x-Math.cos(ta)*tr*4,bl.y-Math.sin(ta)*tr*4,4-tr*0.8,0,6.3); ctx.fill(); }
      var bgl=ctx.createRadialGradient(bl.x,bl.y,0,bl.x,bl.y,SPEC_R*2.4);
      bgl.addColorStop(0,'rgba(255,120,30,0.55)'); bgl.addColorStop(1,'rgba(255,120,30,0)');
      ctx.fillStyle=bgl; ctx.beginPath(); ctx.arc(bl.x,bl.y,SPEC_R*2.4,0,6.3); ctx.fill();
      var core=ctx.createRadialGradient(bl.x,bl.y,0,bl.x,bl.y,SPEC_R);
      core.addColorStop(0,'#fffbe0'); core.addColorStop(0.4,'#ffcf5a'); core.addColorStop(0.75,'#ff7a1a'); core.addColorStop(1,'#c92a0e');
      ctx.fillStyle=core; ctx.beginPath(); ctx.arc(bl.x,bl.y,SPEC_R,0,6.3); ctx.fill(); }

    // blast
    for(var bs=0;bs<G.blasts.length;bs++){ var b4=G.blasts[bs];
      var t4=b4.age/b4.life, ease=1-Math.pow(1-Math.min(1,t4/0.7),2);
      var rw=SPEC_SPLASH*(0.12+ease), rh=rw*0.16+3;
      var fa2=Math.max(0,1-t4*3.2);
      if(fa2>0){ var flg=ctx.createRadialGradient(b4.x,b4.y,0,b4.x,b4.y,rw*0.55);
        flg.addColorStop(0,'rgba(255,255,235,'+fa2+')'); flg.addColorStop(0.4,'rgba(255,210,140,'+(fa2*0.6)+')'); flg.addColorStop(1,'rgba(255,180,90,0)');
        ctx.fillStyle=flg; ctx.beginPath(); ctx.ellipse(b4.x,b4.y,rw*0.55,rw*0.3+14,0,0,6.3); ctx.fill(); }
      var ra=Math.max(0,1-t4);
      ctx.globalAlpha=ra;
      var rg=ctx.createRadialGradient(b4.x,b4.y,0,b4.x,b4.y,rw);
      rg.addColorStop(0,'rgba(255,150,40,0.4)'); rg.addColorStop(0.7,'rgba(255,100,25,0.25)'); rg.addColorStop(1,'rgba(255,90,20,0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.ellipse(b4.x,b4.y,rw,rh,0,0,6.3); ctx.fill();
      ctx.strokeStyle='rgba(255,190,110,'+ra+')'; ctx.lineWidth=2*(1-t4*0.4);
      ctx.beginPath(); ctx.ellipse(b4.x,b4.y,rw,rh,0,0,6.3); ctx.stroke();
      ctx.globalAlpha=1; }

    for(var em2=0;em2<G.embers.length;em2++){ var em=G.embers[em2], ea=1-em.age/em.life;
      ctx.fillStyle='rgba(70,60,50,'+(ea*0.5)+')'; ctx.beginPath(); ctx.arc(em.x,em.y,1.2*ea+0.5,0,6.3); ctx.fill(); }
    for(var as2=0;as2<G.ash.length;as2++){ var as=G.ash[as2], aa=1-as.age/as.life;
      ctx.fillStyle='rgba(120,105,90,'+(aa*0.75)+')'; ctx.beginPath(); ctx.arc(as.x,as.y,1.3*aa+0.5,0,6.3); ctx.fill(); }

    drawDragon();
    ctx.restore();

    /* ---- HUD ---- */
    ctx.textAlign='left'; ctx.textBaseline='middle';
    // health
    var hw=76;
    r(10,10,hw+2,8,'rgba(6,10,20,0.75)');
    var frac=Math.max(0,G.hp/MAXHP);
    var hc = frac>0.5 ? '#5FD08A' : (frac>0.22 ? '#E8B23F' : '#E4574C');
    r(11,11,Math.round(hw*frac),6,hc);
    r(11,11,Math.round(hw*frac),2,'rgba(255,255,255,0.28)');
    // spare lives, as small pips on the end of the health bar
    for(var lv=0; lv<G.lives; lv++) r(10+hw+6+lv*6, 11, 4, 6, '#9CC8FF');
    // the burst magazine, under health because they are both things you spend
    var pfz=fireProfile();
    r(10,20,hw+2,5,'rgba(6,10,20,0.75)');
    var bfrac=Math.max(0,Math.min(1,G.burst/pfz.size));
    r(11,21,Math.round(hw*bfrac),3, G.burst>=1?'#6FD3E8':'#3E5A66');
    // notches, so a longer magazine is visibly longer rather than just fuller
    for(var nk=1; nk<Math.min(pfz.size,12); nk++){
      var nx=11+Math.round(hw*(nk/Math.min(pfz.size,12)));
      r(nx,21,0.7,3,'rgba(8,14,26,0.85)');
    }
    // special
    r(10,27,hw+2,7,'rgba(6,10,20,0.75)');
    var sready=G.spec>=100;
    r(11,28,Math.round(hw*(G.spec/100)),5, sready?'#FFD24A':'#C2652A');
    if(sready){ ctx.font='700 6px "Archivo Black", Arial Black, sans-serif';
      ctx.fillStyle='#3A2A06'; ctx.fillText('B  READY',16,31); }
    // fire power, as filled chevrons, with what the next one costs
    for(var pw=0; pw<POWER_MAX; pw++){
      var on=pw<G.power;
      r(10+pw*7, 37, 5, 4, on?'#FFB748':'rgba(120,110,100,0.35)');
      if(on) r(10+pw*7, 37, 5, 1.4, '#FFE1A0');
    }
    var nxt=nextPowerAt();
    if(nxt!==null){
      ctx.font='500 6px "DM Mono", monospace';
      ctx.fillStyle = canLevel() ? '#FFD24A' : '#66748F';
      ctx.fillText(canLevel()? 'UPGRADE READY' : ('NEXT '+nxt), 10+POWER_MAX*7+4, 39);
    }
    // a brief word when a pickup lands, so its effect is never a mystery
    if(G.pickFlash && G.pickFlash.t>0){
      var pf=G.pickFlash;
      ctx.save(); ctx.globalAlpha=Math.min(1,pf.t/0.5);
      ctx.textAlign='center'; ctx.font='700 8px "Archivo Black", Arial Black, sans-serif';
      ctx.fillStyle = pf.kind==='power'?'#FFD24A':(pf.kind==='heal'?'#8CE6A6':'#9CC8FF');
      ctx.fillText(pf.kind==='power'?('FIRE '+G.power):(pf.kind==='heal'?'MENDED':'EXTRA LIFE'),
                   DX, G.y-26-(1.1-pf.t)*10);
      ctx.restore(); ctx.textAlign='left';
    }
    // score, kept left so it never sits under the page links
    ctx.textAlign='left';
    ctx.font='700 14px "Archivo Black", Arial Black, sans-serif';
    ctx.fillStyle='#E8C87A'; ctx.fillText(String(G.score),10,52);
    ctx.font='500 6px "DM Mono", monospace'; ctx.fillStyle='#7A88A8';
    ctx.fillText('BEST '+G.best,10,63);

    if(G.state==='ready'){
      ctx.globalAlpha=0.55; r(0,0,W,H,'#070B16'); ctx.globalAlpha=1;
      ctx.textAlign='center';
      ctx.font='500 8px "DM Mono", monospace'; ctx.fillStyle='#9FB0CC';
      ctx.fillText('hold UP to climb',W/2,H/2-24);
      ctx.fillText('A breathes fire, in short bursts',W/2,H/2-10);
      ctx.fillText('B when the bar is full',W/2,H/2+4);
      ctx.fillText('score 50 to earn a longer one',W/2,H/2+18);
      ctx.fillStyle='#E8A63F'; ctx.font='700 9px "Archivo Black", Arial Black, sans-serif';
      ctx.fillText('BEAT '+TARGET,W/2,H/2+40);
      if(G.best>0){ ctx.fillStyle='#7A88A8'; ctx.font='500 7px "DM Mono", monospace'; ctx.fillText('BEST '+G.best,W/2,H/2+32); }
    }
    if(G.state==='entry'){
      ctx.globalAlpha=0.86; r(0,0,W,H,'#070B16'); ctx.globalAlpha=1;
      ctx.textAlign='center';
      ctx.font='700 13px "Archivo Black", Arial Black, sans-serif';
      ctx.fillStyle='#E8A63F'; ctx.fillText('HIGH SCORE',W/2,H/2-52);
      ctx.font='700 11px "Archivo Black", Arial Black, sans-serif';
      ctx.fillStyle='#EFE6D2'; ctx.fillText(G.score+' PTS',W/2,H/2-34);

      var nm=entryName(), bw=26, x0=W/2-bw/2;
      G.entry.blink+=0.035;
      for(var ci=0;ci<2;ci++){
        var cx=x0+ci*bw, sel=(ci===G.entry.pos);
        r(cx-10,H/2-18,20,26, sel?'#1B2A44':'#101725');
        if(sel){
          r(cx-10,H/2-18,20,2,'#FFD24A'); r(cx-10,H/2+6,20,2,'#FFD24A');
          // little arrows so it is obvious the stick changes the letter
          ctx.fillStyle='#FFD24A';
          ctx.beginPath(); ctx.moveTo(cx,H/2-24); ctx.lineTo(cx-4,H/2-20); ctx.lineTo(cx+4,H/2-20); ctx.closePath(); ctx.fill();
          ctx.beginPath(); ctx.moveTo(cx,H/2+14); ctx.lineTo(cx-4,H/2+10); ctx.lineTo(cx+4,H/2+10); ctx.closePath(); ctx.fill();
        }
        ctx.font='700 15px "Archivo Black", Arial Black, sans-serif';
        ctx.fillStyle = sel ? '#FFE9A8' : '#9FB0CC';
        if(!sel || Math.sin(G.entry.blink*4)>-0.82) ctx.fillText(nm.charAt(ci),cx,H/2-4);
      }
      ctx.font='500 7px "DM Mono", monospace'; ctx.fillStyle='#7E8FAC';
      ctx.fillText('D-pad picks letters  ·  A confirms',W/2,H/2+30);
      ctx.fillText('or just type it',W/2,H/2+42);
    }
    if(G.state==='over'){
      ctx.globalAlpha=0.84; r(0,0,W,H,'#070B16'); ctx.globalAlpha=1;
      ctx.textAlign='center';
      var beat=G.score>TARGET;
      ctx.font='700 16px "Archivo Black", Arial Black, sans-serif';
      ctx.fillStyle=beat?'#7FE3A0':'#E8A63F';
      ctx.fillText(beat?'YOU BEAT IT':'DOWNED',W/2,H/2-46);
      ctx.font='700 11px "Archivo Black", Arial Black, sans-serif';
      ctx.fillStyle='#EFE6D2'; ctx.fillText(G.score+' PTS',W/2,H/2-26);
      var tb=(G.table&&G.table.length)?G.table:[{n:'--',s:G.score}];
      ctx.font='500 7px "DM Mono", monospace';
      for(var ri=0;ri<tb.length;ri++){
        var mine=(ri===G.rank), ry=H/2-8+ri*11;
        ctx.textAlign='right'; ctx.fillStyle=mine?'#FFD24A':'#6E7E9C'; ctx.fillText((ri+1)+'.',W/2-40,ry);
        ctx.textAlign='left';  ctx.fillStyle=mine?'#FFD24A':'#C6D4E6'; ctx.fillText(tb[ri].n,W/2-32,ry);
        ctx.textAlign='right'; ctx.fillStyle=mine?'#FFD24A':'#A9BCD2'; ctx.fillText(String(tb[ri].s),W/2+22,ry);
        if(mine){ ctx.textAlign='left'; ctx.fillStyle='#FFD24A'; ctx.fillText('NEW',W/2+30,ry); }
      }
      ctx.textAlign='center'; ctx.fillStyle='#9FB0CC';
      ctx.fillText('A to fly again',W/2,H/2-8+tb.length*11+10);
    }
  }
  /* ---------- input ----------
     Arrows fly, A and B act. The on-screen buttons and the keyboard go
     through the same path so the two can never drift apart. */
  var HOLD={left:1,right:1,up:1,down:1,use:1,call:1};
  var K={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',
         KeyA:'use',Enter:'use',Space:'use',KeyB:'call'};

  function fire(k){
    if(mode!=='game') return;
    keys[k]=true;
    if(G.state==='entry'){
      // the same four buttons spell a name, arcade cabinet style
      if(k==='up')         entryCycle(1);
      else if(k==='down')  entryCycle(-1);
      else if(k==='left')  entryMove(-1);
      else if(k==='right') entryMove(1);
      else if(k==='use')   entryConfirm();
      else if(k==='call')  entryMove(-1);
      keys[k]=false;
      return;
    }
    if(k==='use' && G.state==='over'){ gameReset(); G.state='play'; }
    else if(k==='call') G.tapSpecial=true;
  }

  window.addEventListener('keydown',function(e){
    if(mode!=='game'){
      if(e.code==='Enter'||e.code==='Space'){
        if(document.activeElement===document.getElementById('playbtn')) return;
      }
      return;
    }
    if(G.state==='entry'){
      // Typing beats nudging a letter wheel 26 times, so on a keyboard the
      // name is just typed. The D-pad path stays for phones.
      if(e.key && e.key.length===1 && ALPHA.indexOf(e.key.toUpperCase())>=0){
        e.preventDefault(); entryType(e.key); return;
      }
      if(e.code==='Backspace'){ e.preventDefault(); entryMove(-1); return; }
      if(e.code==='Enter'||e.code==='NumpadEnter'){ e.preventDefault(); G.entry.pos=1; entryConfirm(); return; }
    }
    if(e.code==='Escape'){ e.preventDefault(); leaveGame(); return; }
    var k=K[e.code]; if(!k) return;
    e.preventDefault();
    fire(k);
    var btn=document.querySelector('[data-k="'+k+'"]'); if(btn) btn.classList.add('held');
  });
  window.addEventListener('keyup',function(e){
    var k=K[e.code]; if(!k) return;
    if(HOLD[k]) keys[k]=false;
    var btn=document.querySelector('[data-k="'+k+'"]'); if(btn) btn.classList.remove('held');
  });

  document.querySelectorAll('[data-k]').forEach(function(b){
    var k=b.dataset.k;
    b.addEventListener('pointerdown',function(e){ e.preventDefault(); b.setPointerCapture&&b.setPointerCapture(e.pointerId); fire(k); });
    ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
      b.addEventListener(ev,function(){ if(HOLD[k]) keys[k]=false; });
    });
  });

  /* ---------- the landing, and getting in and out of the game ---------- */
  function bestScore(){
    var t=loadScores();
    return t.length ? t[0].s : 0;
  }
  function paintLanding(){
    document.getElementById('tgt').textContent=TARGET+' to beat';
    var b=bestScore();
    var el=document.getElementById('yourbest');
    el.textContent = b ? (b>=TARGET ? 'Your best: '+b+'. You already beat it.' : 'Your best so far: '+b)
                       : '';
  }

  var running=false;
  function startGame(){
    document.body.classList.add('playing');
    mode='game';
    keys={};
    gameReset();
    resize();
    if(!running){ running=true; last=performance.now(); acc=0; requestAnimationFrame(frame); }
  }
  function leaveGame(){
    mode='idle';
    keys={};
    document.body.classList.remove('playing');
    paintLanding();
  }
  document.getElementById('playbtn').addEventListener('click',startGame);
  document.getElementById('backbtn').addEventListener('click',leaveGame);
  document.getElementById('exitbtn').addEventListener('click',leaveGame);

  function resize(){
    var box=document.getElementById('stage').getBoundingClientRect();
    if(!box.width||!box.height) return;          // hidden while on the landing
    var s=Math.min(box.width/W, box.height/H);
    var dpr=Math.min(2,window.devicePixelRatio||1);
    cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
    cv.width=Math.round(W*s*dpr); cv.height=Math.round(H*s*dpr);
    ctx.setTransform(s*dpr,0,0,s*dpr,0,0);
    ctx.imageSmoothingEnabled=false;
  }

  var last=performance.now(), acc=0;
  function frame(now){
    var dt=Math.min(0.05,(now-last)/1000); last=now; acc+=dt;
    tick+=dt;
    if(mode==='game'){
      while(acc>=1/60){ gameStep(1/60); acc-=1/60; }
      gameRender();
    } else { acc=0; }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize',function(){ if(mode==='game') resize(); });
  paintLanding();
})();
</script>

</body>
